name: my-messenger

services:

  #
  # Db
  #

  redis-db:
    image: redis:latest
    container_name: msg_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  auth-db:
    image: postgres:latest
    environment:
      - POSTGRES_DB=auth_db
      - POSTGRES_USER=auth_user
      - POSTGRES_PASSWORD=auth_pass
    volumes:
      - auth_db_data:/var/lib/data
    ports:
      - "5431:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  msg-db:
    image: postgres:latest
    environment:
      - POSTGRES_DB=msg_db
      - POSTGRES_USER=msg_user
      - POSTGRES_PASSWORD=msg_pass
    volumes:
      - msg_db_data:/var/lib/data
    ports:
      - "5430:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msg_user -d msg_db"]
      interval: 3s
      timeout: 3s
      retries: 5
  
  media-db:
    image: postgres:latest
    environment:
      - POSTGRES_DB=media_db
      - POSTGRES_USER=media_user
      - POSTGRES_PASSWORD=media_pass
    volumes:
      - media_db_data:/var/lib/data
    ports:
      - "5429:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media_user -d media_db"]
      interval: 3s
      timeout: 3s
      retries: 5
  
  #
  # Services
  #

  auth-service:
    build:
      context: ..
      dockerfile: services/auth/Dockerfile
    env_file:
      - ../config/common.env
      - ../config/redis_channels.env
      - ../config/auth.env
    depends_on:
      auth-db:
        condition: service_healthy
    volumes:
      - ../certs/jwt:/app/certs/jwt:ro
  
  msg-service:
    build:
      context: ..
      dockerfile: services/msg/Dockerfile
    env_file:
      - ../config/common.env
      - ../config/redis_channels.env
      - ../config/msg.env
    depends_on:
      msg-db:
        condition: service_healthy
      redis-db:
        condition: service_healthy
    volumes:
      - ../certs/jwt/public.key:/app/certs/jwt/public.key:ro
    
  ws-service:
    build: 
      context: ..
      dockerfile: services/ws/Dockerfile
    env_file:
      - ../config/common.env
      - ../config/redis_channels.env
      - ../config/ws.env
    depends_on:
      redis-db:
        condition: service_healthy
    volumes:
      - ../certs/jwt/public.key:/app/certs/jwt/public.key:ro
  
  status-service:
    build: 
      context: ..
      dockerfile: services/status/Dockerfile
    env_file:
      - ../config/common.env
      - ../config/redis_channels.env
      - ../config/status.env
    depends_on:
      redis-db:
        condition: service_healthy
    volumes:
      - ../certs/jwt/public.key:/app/certs/jwt/public.key:ro
  
  email-service:
    build: 
      context: ..
      dockerfile: services/email/Dockerfile
    env_file:
      - ../config/common.env
      - ../config/redis_channels.env
      - ../config/email.env
    depends_on:
      redis-db:
        condition: service_healthy

  media-service:
    build: 
      context: ..
      dockerfile: services/media/Dockerfile
    env_file:
      - ../config/common.env
      - ../config/media.env
    depends_on:
      media-db:
        condition: service_healthy
    volumes:
      - ../certs/jwt/public.key:/app/certs/jwt/public.key:ro
      - ../data:/var/data

  #
  # GateWay for all services
  #

  gateway-service:
    build: 
      context: ..
      dockerfile: services/gateway/Dockerfile
    env_file:
      - ../config/common.env
      - ../config/redis_channels.env
      - ../config/gateway.env
    volumes:
      - ../certs/jwt/public.key:/app/certs/jwt/public.key:ro

  #
  # Web
  #

  frontend-service:
    build:
      context: ../web/
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api

  #
  # Main Entry
  #

  edge-service:
    build: ../services/edge
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ../certs/ssl:/etc/nginx/certs/:ro
      - ../data:/var/data:ro

volumes:
  auth_db_data:
  msg_db_data:
  redis_data:
  media_db_data: