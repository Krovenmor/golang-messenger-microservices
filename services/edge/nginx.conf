map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream web_frontend {
    server frontend-service:80;
    keepalive 16;
}

upstream gateway {
    server gateway-service:8080;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;

    server_name MyMessenger MyMessenger.local;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://web_frontend;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location ~ ^/static/avatars/([a-zA-Z0-9-]+)$ {
        alias /var/data/public/photos/avatars/$1.jpeg;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        default_type image/jpeg;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location /protected-media/ {
        internal;
        alias /var/data/storage/private/;
        
        sendfile on;
        tcp_nopush on;
    }

    location /api/ {
        proxy_pass http://gateway;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location /api/ws {
        proxy_pass http://gateway;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /health/check {
        access_log off;
        return 200 "ok\n";
    }
}